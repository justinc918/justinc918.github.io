<?xml version="1.0" encoding="utf-8"?>
<!--
  Scrollbar thumb placeholder.
  - viewBox is 120x16 but preserveAspectRatio="none" lets it stretch to whatever
    width/height the scrollbar gives it, so replace the <rect> with real art later.
  - Keep preserveAspectRatio="none" if you want the art to stretch to the thumb box.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 16" preserveAspectRatio="none">
  <rect x="1" y="1" width="118" height="14" rx="7" ry="7" fill="#c4d3ff" />
</svg>
