<?xml version="1.0" encoding="UTF-8"?>
<!--
  TEMPLATE  box/border.svg  (9-slice frame, the PREFERRED box art)
  ---------------------------------------------------------------------------
  Used as `assets.box.border.src`. A 9-slice frame is cut into 4 fixed corners,
  4 stretchable/tileable edges, and a discarded center, so the frame hugs any
  image size. This is the mechanism already wired in src/pages/Digital.tsx.

  This canvas is 64 x 64 with slice = 16:
    columns/rows 0..16 and 48..64 = CORNERS (kept at fixed pixel size)
    columns/rows 16..48          = EDGES  (stretched or tiled along their run)
    center 16..48 x 16..48       = DISCARDED (leave transparent)

  DRAW HERE:
    - Corner art inside each 16x16 corner box (top-left shown as guide).
    - Edge art inside the 16px-wide bands between corners; a straight line can
      use repeat:'stretch', a pattern should tile cleanly (repeat:'round').
  Match the slice/width you pass in code (currently slice:16, width:16).

  Faint gray rects below are SLICE GUIDES  delete them before shipping.
  Palette: accent ~#98B3E6 / #c4d3ff on dark bg rgb(20,24,39).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- slice guides (remove) -->
  <g stroke="#ffffff" stroke-opacity="0.12" stroke-width="0.5" fill="none">
    <line x1="16" y1="0" x2="16" y2="64" />
    <line x1="48" y1="0" x2="48" y2="64" />
    <line x1="0" y1="16" x2="64" y2="16" />
    <line x1="0" y1="48" x2="64" y2="48" />
  </g>

  <!-- example corner (top-left) + example edges: replace with your art -->
  <path d="M2,16 L2,2 L16,2" fill="none" stroke="#98B3E6" stroke-opacity="0.7" stroke-width="2" />
  <line x1="16" y1="2" x2="48" y2="2" stroke="#98B3E6" stroke-opacity="0.7" stroke-width="2" />
  <line x1="16" y1="62" x2="48" y2="62" stroke="#98B3E6" stroke-opacity="0.7" stroke-width="2" />
  <line x1="2" y1="16" x2="2" y2="48" stroke="#98B3E6" stroke-opacity="0.7" stroke-width="2" />
  <line x1="62" y1="16" x2="62" y2="48" stroke="#98B3E6" stroke-opacity="0.7" stroke-width="2" />
  <path d="M48,2 L62,2 L62,16" fill="none" stroke="#98B3E6" stroke-opacity="0.7" stroke-width="2" />
  <path d="M62,48 L62,62 L48,62" fill="none" stroke="#98B3E6" stroke-opacity="0.7" stroke-width="2" />
  <path d="M16,62 L2,62 L2,48" fill="none" stroke="#98B3E6" stroke-opacity="0.7" stroke-width="2" />
</svg>
