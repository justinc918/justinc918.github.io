<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- 9-slice frame. Slice at 16px: the four 16x16 corners (rounded L +
       corner dot) stay fixed; the thin straight edges between them stretch. -->
  <rect x="8" y="8" width="48" height="48" rx="4"
        fill="none" stroke="#c4d3ff" stroke-opacity="0.55" stroke-width="1.5" />
  <g fill="#c4d3ff">
    <rect x="5" y="5" width="6" height="6" rx="1" />
    <rect x="53" y="5" width="6" height="6" rx="1" />
    <rect x="5" y="53" width="6" height="6" rx="1" />
    <rect x="53" y="53" width="6" height="6" rx="1" />
  </g>
</svg>
